# Alternativa: despliegue desde código fuente en App Runner (sin ECR).
version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  runtime-version: 20
  command: node dist/server.js
  network:
    port: 4000
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: '4000'
